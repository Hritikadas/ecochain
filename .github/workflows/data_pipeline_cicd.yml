name: EcoChain Free DataOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # GitHub Action runners give you up to 2,000 minutes per month entirely for free!
     malice:
    - name: Install Data Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    - name: Run ETL Data Pipeline Engine
      run: |
        python backend/scripts/data_pipeline.py
