name: EcoChain Free DataOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        

   - name: Install Data Engineering Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests beautifulsoup4 langchain-community langchain-huggingface langchain-chroma chromadb

    - name: Run ETL Data Pipeline Engine
      run: |
        python backend/scripts/data_pipeline.py
